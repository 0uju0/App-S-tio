const mini=(h,s=50)=>`<div class="b" style="width:${s+6}px;height:${s+6}px;background:#2B1810"><svg viewBox="0 0 60 60" width="${s}" height="${s}" aria-hidden="true"><ellipse cx="30" cy="55" rx="20" ry="4" fill="#C9A25B" opacity=".5"/>${glyph(h)}</svg></div>`;

const island=(inner,w)=>`<div class="h"><svg viewBox="0 0 300 200" width="${w}" height="${w*2/3}" role="img" aria-label="Holograma flutuante"><defs><linearGradient id="bm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C9A25B" stop-opacity=".55"/><stop offset="1" stop-color="#C9A25B" stop-opacity="0"/></linearGradient></defs><polygon points="70,186 230,186 200,100 100,100" fill="url(#bm)"/><ellipse cx="150" cy="186" rx="90" ry="12" fill="#C9A25B" opacity=".4" stroke="#B8893B" stroke-width="2"/><g class="fl"><polygon points="76,98 224,98 150,164" fill="#4A2E20" stroke="#2B1810" stroke-width="3" stroke-linejoin="round"/><polygon points="150,50 232,92 150,134 68,92" fill="#F3EEE4" stroke="#2B1810" stroke-width="3" stroke-linejoin="round"/>${inner}</g></svg></div>`;

let rels=[],conf={},relSel=null,props=[],user=null,sid=null,sitio=null,cants=[],fers=[],itens=[],movs=[],view='home',selId=null,cat='todos',q='',unsubs=[],erroDb='';

/* ---------- cálculos ---------- */
const nextT=(c,t)=>t==='r'?(c.ultimaRega||c.plantio)+c.regaDias*DAY:(c.ultimaCapina||c.plantio)+c.capinaDias*DAY;
const dias=(c,t)=>Math.round((d0(nextT(c,t))-d0(Date.now()))/DAY);
const diasV=i=>Math.round((d0(i.validade)-d0(Date.now()))/DAY);
const quando=d=>d<0?`atrasada ${-d} d`:d===0?'hoje':d===1?'amanhã':`em ${d} dias`;
const baixo=i=>(i.min||0)>0&&i.qtd<=i.min;
function avisos(){
  const a=[];
  cants.forEach(c=>[['r','Regar'],['c','Capinar']].forEach(([t,v])=>{const d=dias(c,t);if(d<=0)a.push({k:'t',o:d,c,t,v})}));
  itens.forEach(i=>{if(baixo(i))a.push({k:'e',o:-50,i});if(i.validade&&diasV(i)<=7)a.push({k:'v',o:diasV(i)-60,i})});
  fers.forEach(f=>{if(baixo(f))a.push({k:'f',o:-40,f})});
  return a.sort((x,y)=>x.o-y.o);
}

const back=v=>`<div><button class="link" data-go="${v}">‹ Voltar</button></div>`;
const field=(id,l,inner)=>`<div><label for="${id}">${l}</label>${inner}</div>`;
const inp=(id,v='',x='')=>`<input class="in" id="${id}" value="${esc(v)}" ${x}>`;
const selH=(id,opts,cur)=>`<select class="in" id="${id}">${opts.map(([k,l])=>`<option value="${k}"${k===cur?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
const box=(v,l)=>`<div class="c box"><b>${v}</b><div class="m" style="font-size:11px">${l}</div></div>`;

/* Hortas */

  const rows=cants.map(c=>{const dr=dias(c,'r'),dc=dias(c,'c'),d=Math.min(dr,dc),t=dr<=dc?'Regar':'Capinar';
    return rowH(H(c.planta,'planta'),`${esc(c.nome)} · ${esc(c.planta)}`,`Plantio ${fmt(c.plantio)}`,d<=0?t:'Em '+d+' d',d<0?'p':d===0?'w':'',`data-act="abrir" data-id="${c.id}"`)}).join('');
  return `<h1>Plantações e Hortas</h1>${island(PLOTS,220)}${rows||'<div class="c"><div class="m">Nenhum canteiro ainda. Cadastre o primeiro.</div></div>'}<button class="btn" data-act="novo">+ Novo canteiro</button>`}
function vNovo(){return `${back('hortas')}<h1>Novo canteiro</h1>${field('nome','Nome do canteiro',inp('nome','Canteiro '+(cants.length+1)))}${field('planta','Planta',inp('planta','','list="plantas" placeholder="Ex.: tomate, couve, mandioca" autocomplete="off"')+`<datalist id="plantas">${Object.values(PRE).filter(p=>p.n!=='Outra planta').map(p=>`<option value="${p.n}">`).join('')}</datalist>`)}<div id="prev" class="r"></div>${field('plantio','Data de plantio',inp('plantio',hojeISO(),'type="date"'))}<div class="g">${field('rd','Regar a cada (dias)',inp('rd',3,'type="number" min="1"'))}${field('cd','Capinar a cada (dias)',inp('cd',15,'type="number" min="1"'))}</div><div class="m">Os intervalos são valores iniciais de exemplo. Ajuste conforme seu clima e solo.</div><button class="btn" data-act="salvar">Salvar canteiro</button>`}

<div class="m" style="text-align:center">Plantado em ${fmt(c.plantio)}</div><button class="btn w2" data-act="excluir" data-id="${c.id}">Excluir canteiro</button>`}

const listaOf=()=>filtraF().map(f=>rowH(H(f.nome,'ferramenta'),esc(f.nome),`${esc(f.local||'sem local')} · qtd ${f.qtd}${f.emprestada?' · com '+esc(f.emprestada.com):''}`,f.emprestada?'Emprestada':EST[f.estado],f.emprestada?'w':EC[f.estado],`data-act="ofabrir" data-id="${f.id}"`)).join('')||'<div class="c"><div class="m">Nenhuma ferramenta encontrada.</div></div>';

/* Paiol */
const filtraP=()=>itens.filter(i=>cat==='todos'||i.cat===cat).sort((a,b)=>a.nome.localeCompare(b.nome));

    return rowH(H(i.nome,'insumo'),esc(i.nome),i.validade?`Validade ${fmt(i.validade)}${dv<=30?' · '+(dv<0?'vencido':quando(dv)):''}`:'Sem validade',baixo(i)?'Baixo · '+i.qtd+' '+esc(i.unidade):i.qtd+' '+esc(i.unidade),baixo(i)||(dv!==null&&dv<0)?'p':'',`data-act="paabrir" data-id="${i.id}"`)}).join('');
  return `<h1>Paiol</h1>${island(big('saco'),170)}<div class="r">${box(ent,'Reposições hoje')}${box(sai,'Saídas hoje')}${box(venc,'Vencem em 30 d')}</div>

/* Conferência da oficina */
const fmtDT=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const loadConf=()=>{try{conf=JSON.parse(localStorage.getItem('conf_'+sid)||'{}')}catch(e){conf={}}};
const saveConf=()=>{try{localStorage.setItem('conf_'+sid,JSON.stringify(conf))}catch(e){}};
const valM=m=>m.st==='corrigida'?m.corrigidoPara:m.depois;
const descM=(m,html)=>{const nm=html?esc(m.nome):m.nome,v=valM(m);return m.campo==='qtd'?`${nm}: quantidade ${m.antes} → ${v} (${v-m.antes>0?'+':''}${v-m.antes})`:`${nm}: estado ${EST[m.antes]} → ${EST[v]}`};
const stM=m=>m.st==='desfeita'?'Desfeita':m.st==='corrigida'?'Corrigida':'Aplicada';
const relTxt=r=>['RELATÓRIO DE CONFERÊNCIA DA OFICINA',sitio?.nome||'','Data: '+fmtDT(r.em),'Responsável: '+r.por,'Conferidas: '+r.conferidos+' de '+r.total,'','ALTERAÇÕES NO ESTOQUE',...(r.mudancas.length?r.mudancas.map(m=>'- '+descM(m,false)+(m.nota?' ('+m.nota+')':'')+' ['+stM(m).toLowerCase()+']'):['- nenhuma']),'','OBSERVAÇÕES',...(r.obs.length?r.obs.map(o=>'- '+o.nome+': '+o.nota):['- nenhuma']),'','NÃO CONFERIDAS',...(r.naoConferidos.length?r.naoConferidos.map(n=>'- '+n):['- nenhuma'])].join('\n');
const baixar=(txt,nome,tipo)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();a.remove()};
function vConf(){
  const lista=fers.slice().sort((a,b)=>a.nome.localeCompare(b.nome)),feitos=lista.filter(f=>conf[f.id]?.ok).length;
  const rows=lista.map(f=>{const c=conf[f.id]||{},ok=!!c.ok,q=c.qtd??f.qtd,e=c.estado||f.estado;
    return `<div class="c"><label class="r chk"><input type="checkbox" data-cf="${f.id}" ${ok?'checked':''}>${mini(H(f.nome,'ferramenta'),40)}<div class="f1"><h2>${esc(f.nome)}</h2><div class="m">Esperado: ${f.qtd}${f.emprestada?' · emprestada a '+esc(f.emprestada.com):''}</div></div></label>${ok?`<div class="r"><button class="btn w2 sm" data-act="cfmenos" data-id="${f.id}" aria-label="Diminuir">−</button><div class="f1" style="text-align:center"><b style="font-size:20px">${q}</b><div class="m">encontradas</div></div><button class="btn w2 sm" data-act="cfmais" data-id="${f.id}" aria-label="Aumentar">+</button></div>${selH('cfe-'+f.id,Object.entries(EST),e)}<input class="in" id="cfn-${f.id}" placeholder="Observação (opcional)" value="${esc(c.nota||'')}">`:''}</div>`}).join('');
  return `${back('oficina')}<h1>Conferência da oficina</h1><div class="m">Marque cada ferramenta conferida. Ao finalizar, o estoque é atualizado e o relatório fica salvo, com possibilidade de correção.</div>
<div class="c"><div class="r"><h2 class="f1">${feitos} de ${lista.length} conferidas</h2><span class="t">${new Date().toLocaleDateString('pt-BR')}</span></div><div class="bar"><i style="width:${lista.length?feitos/lista.length*100:0}%"></i></div></div>
${rows||'<div class="c"><div class="m">Cadastre ferramentas antes de fazer a conferência.</div></div>'}
<button class="btn w2" data-act="cfmarcar">Marcar todas como conferidas</button><button class="btn" data-act="cffinalizar">Finalizar conferência</button><button class="link" data-act="cfdescartar">Descartar conferência em andamento</button>`}
function vRels(){return `${back('oficina')}<h1>Relatórios da oficina</h1>`+(rels.map(r=>{const n=r.mudancas.filter(m=>m.st!=='desfeita').length;return `<button class="c" data-act="relabrir" data-id="${r.id}" style="text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%"><div class="r"><div class="f1"><h2>Conferência de ${fmtDT(r.em)}</h2><div class="m">${r.conferidos} de ${r.total} conferidas · por ${esc(r.por)}</div></div><span class="t ${n?'w':''}">${n} alteração(ões)</span></div></button>`}).join('')||'<div class="c"><div class="m">Nenhum relatório ainda. Faça a primeira conferência.</div></div>')}
function vRelDet(){
  const r=rels.find(x=>x.id===relSel);if(!r)return vRels();
  const ls=r.mudancas.map((m,i)=>`<div class="c"><div class="m" style="color:#2B1810">${descM(m,true)}${m.nota?' · '+esc(m.nota):''}</div><div class="r"><span class="t ${m.st==='desfeita'?'w':m.st==='corrigida'?'p':''}">${stM(m)}</span><div class="f1"></div>${m.st==='desfeita'?`<button class="btn w2 sm" data-act="rreaplicar" data-id="${r.id}" data-i="${i}">Reaplicar</button>`:`<button class="btn w2 sm" data-act="rdesfazer" data-id="${r.id}" data-i="${i}">Desfazer</button><button class="btn w2 sm" data-act="rcorrigir" data-id="${r.id}" data-i="${i}">Corrigir</button>`}</div></div>`).join('')||'<div class="c"><div class="m">Nenhuma alteração: tudo estava como esperado.</div></div>';
  return `${back('rels')}<h1>Relatório da conferência</h1><div class="m">${fmtDT(r.em)} · por ${esc(r.por)}</div><div class="r">${box(r.conferidos,'Conferidas')}${box(r.naoConferidos.length,'Não conferidas')}${box(r.mudancas.length,'Alterações')}</div><h2>Alterações no estoque</h2>${ls}
${r.obs.length?`<div class="c"><h2>Observações</h2>${r.obs.map(o=>`<div class="m">${esc(o.nome)}: ${esc(o.nota)}</div>`).join('')}</div>`:''}
${r.naoConferidos.length?`<div class="c"><h2>Não conferidas</h2><div class="m">${r.naoConferidos.map(esc).join(', ')}</div></div>`:''}
<button class="btn" data-act="relbaixar" data-id="${r.id}">Baixar relatório (texto)</button>`}
async function ajustaRel(a,rid,i){
  const r=rels.find(x=>x.id===rid),ms=r.mudancas.map(x=>({...x})),m=ms[i],f=fers.find(x=>x.id===m.id);
  if(!f){toast('Essa ferramenta não existe mais');return}
  const vig=m.st==='desfeita'?m.antes:valM(m);
  if(f[m.campo]!==vig&&!confirm('O valor atual ('+(m.campo==='estado'?EST[f[m.campo]]:f[m.campo])+') mudou depois da conferência. Continuar mesmo assim?'))return;
  let novo;
  if(a==='rdesfazer'){novo=m.antes;m.st='desfeita'}
  else if(a==='rreaplicar'){novo=m.depois;m.st='aplicada'}
  else{
    const s=prompt(m.campo==='qtd'?'Quantidade correta:':'Estado correto (bom, reparo ou quebrada):',String(vig));if(s===null)return;
    if(m.campo==='qtd'){novo=parseFloat(s.replace(',','.'));if(!(novo>=0)){toast('Valor inválido');return}}
    else{novo=s.trim().toLowerCase();if(!EST[novo]){toast('Estado inválido');return}}
    m.st='corrigida';m.corrigidoPara=novo}
  const b=writeBatch(db);b.update(dref('ferramentas',m.id),{[m.campo]:novo});b.update(dref('conferencias',rid),{mudancas:ms});await b.commit();toast('Ajuste registrado');
}
async function finalizaConf(){
  const mud=[],obs=[],nao=[];let ok=0;
  fers.forEach(f=>{const c=conf[f.id];if(!c?.ok){nao.push(f.nome);return}ok++;
    const q=c.qtd??f.qtd,e=c.estado||f.estado,nota=c.nota||'';
    if(q!==f.qtd)mud.push({id:f.id,nome:f.nome,campo:'qtd',antes:f.qtd,depois:q,nota,st:'aplicada'});
    if(e!==f.estado)mud.push({id:f.id,nome:f.nome,campo:'estado',antes:f.estado,depois:e,nota,st:'aplicada'});
    if(nota&&q===f.qtd&&e===f.estado)obs.push({nome:f.nome,nota})});
  if(!ok){toast('Marque ao menos uma ferramenta');return}
  if(!confirm('Finalizar a conferência?\n'+ok+' conferida(s) e '+mud.length+' alteração(ões) no estoque.'))return;
  const b=writeBatch(db),rr=doc(col('conferencias'));
  mud.forEach(m=>b.update(dref('ferramentas',m.id),{[m.campo]:m.depois}));
  b.set(rr,{em:Date.now(),por:user.displayName||user.email||'',total:fers.length,conferidos:ok,naoConferidos:nao,mudancas:mud,obs});
  await b.commit();conf={};saveConf();relSel=rr.id;view='reldet';render();scrollTo(0,0);toast('Conferência salva e estoque atualizado');
}

/* ---------- login e dados ---------- */
function falha(err){erroDb='Não consegui acessar o banco. Verifique se o Firestore foi criado e as regras publicadas.';console.error(err);toast('Erro no banco de dados');render()}
let dataUnsubs=[];
const sub=(n,set,ref)=>onSnapshot(ref||col(n),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));refresh()},falha);
function abrirSitio(id){
  dataUnsubs.forEach(f=>f());dataUnsubs=[];sid=id;sitio=null;cants=[];fers=[];itens=[];movs=[];rels=[];holos={};
  dataUnsubs.push(onSnapshot(doc(db,'sitios',sid),s=>{sitio=s.data();refresh()},falha),
    sub('canteiros',a=>cants=a.sort((x,y)=>x.criadoEm-y.criadoEm)),
    sub('ferramentas',a=>fers=a),
    sub('hologramas',a=>{holos=Object.fromEntries(a.map(x=>[x.id,x]))}),
    sub('itens',a=>itens=a),
    sub('conferencias',a=>rels=a,query(col('conferencias'),orderBy('em','desc'),limit(60))),
    sub('movimentos',a=>movs=a,query(col('movimentos'),orderBy('em','desc'),limit(200))));
  render();
}
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];dataUnsubs.forEach(f=>f());dataUnsubs=[];
  user=u;authReady=true;holos={};sid=null;sitio=null;props=[];cants=[];fers=[];itens=[];movs=[];erroDb='';view='home';render();
  if(!u)return;

    const uref=doc(db,'users',u.uid);let id=(await getDoc(uref)).data()?.sitioId;
    if(!id){
      /* primeira vez: limpa dados de teste antigos e cria o sítio */
      const velhos=await getDocs(collection(db,'users',u.uid,'canteiros'));await Promise.all(velhos.docs.map(d=>deleteDoc(d.ref)));
      const r=await addDoc(collection(db,'sitios'),{nome:'Sítio Bom Jesus',donoUid:u.uid,memberUids:[u.uid],xp:0,criadoEm:Date.now()});
      await setDoc(uref,{sitioId:r.id},{merge:true});id=r.id;
    }
    unsubs.push(onSnapshot(query(collection(db,'sitios'),where('memberUids','array-contains',u.uid)),s=>{props=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.criadoEm-b.criadoEm);refresh()},falha));
    abrirSitio(id);
  }catch(err){falha(err)}
});
render();
</script>
