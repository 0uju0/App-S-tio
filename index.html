[/bomba|motobomba|pressurizador/,'bomba'],[/caixa de ferramenta|maleta/,'caixa'],[/escada/,'escada'],
[/prego|parafuso|porca|arruela|arame|grampo|tela\b|cerca|dobradica|cadeado/,'prego'],[/lanterna|lampada|luminaria|holofote|refletor|farol/,'lanterna'],
[/barril|tonel|tambor|caixa d.?agua|cisterna/,'barril','#8FB3C7'],[/vacina|remedio|medicamento|vermifugo|antibiotico|seringa|vitamina/,'seringa'],
[/aerador|aeracao/,'aerador'],[/termometro|sonda|sensor|medidor|phmetro|oximetro/,'termometro'],[/\brede\b|tarrafa|peneira|puca|covo/,'rede'],[/tanque|viveiro|lagoa|represa|lago\b/,'tanque'],
[/sal mineral|mineral|suplemento|nucleo|silagem|feno|fardo/,'saco','#E9C58A'],
[/cafe|cafeeiro|cacau|eucalipto|pinus|mogno|arvore|ipe\b|bambu|coco|palmeira|acai|seringueira|teca/,'arvore','#A9B58A'],
[/flor|rosa\b|girassol|orquidea|margarida|jardim|ornamental|lirio|hibisco|violeta/,'flor','#E8A29A'],
[/uva|jabuticaba/,'cacho','#6B4A7A'],[/banana/,'cacho','#E3C98F'],[/pimenta|malagueta|biquinho|jalapeno/,'pimenta','#D9503F'],[/abacaxi/,'abacaxi'],

[/pimenta|pimentao|morango|acerola|goiaba|cereja|jabuticaba|amora/,'fruto','#D9503F'],[/abobora|jerimum|laranja|mexerica|limao|manga|mamao|caqui/,'fruto','#E69A3A'],

[/trena|metro|nivel|esquadro/,'trena'],[/regador|balde/,'regador'],[/mangueira|cano|tubo/,'mangueira'],[/carrinho|carreta/,'carrinho'],
[/racao|farelo|fuba|farinha|sal\b/,'saco'],[/adubo|calcario|fertiliz|npk|ureia|esterco/,'adubo'],[/semente|muda/,'semente'],

const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'item';
const hashN=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h)};
function calc(nome,kind){
  const n=norm(nome),l=(String(nome).trim()[0]||'?').toUpperCase();
  for(const [re,g,cor] of KW)if(re.test(n))return {g,cor:cor||'#C9A25B',l};
  const cores=['#C9A25B','#A9B58A','#E8A29A','#8FB3C7','#D9A06A','#BDB4A6','#C9D4A8','#E3C98F'];
  return {g:kind==='planta'?'folha':kind==='ferramenta'?'engrenagem':kind==='insumo'?'sacoc':'cristal',cor:cores[hashN(n)%cores.length],l};
}
let holos={};
const H=(nome,kind)=>holos[slug(nome)]||calc(nome,kind);
async function ensureHolo(nome,kind){const k=slug(nome);if(holos[k])return;const h=calc(nome,kind);holos[k]=h;await setDoc(doc(db,'sitios',sid,'hologramas',k),{...h,nome,criadoEm:Date.now()})}
const glyph=h=>{const x=typeof h==='string'?{g:h}:h;return GL[x.g]||(GEN[x.g]||GEN.cristal)(x.cor||'#C9A25B',x.l||'?')};

const island=(inner,w)=>`<div class="h"><svg viewBox="0 0 300 200" width="${w}" height="${w*2/3}" role="img" aria-label="Holograma flutuante"><defs><linearGradient id="bm" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#C9A25B" stop-opacity=".55"/><stop offset="1" stop-color="#C9A25B" stop-opacity="0"/></linearGradient></defs><polygon points="70,186 230,186 200,100 100,100" fill="url(#bm)"/><ellipse cx="150" cy="186" rx="90" ry="12" fill="#C9A25B" opacity=".4" stroke="#B8893B" stroke-width="2"/><g class="fl"><polygon points="76,98 224,98 150,164" fill="#4A2E20" stroke="#2B1810" stroke-width="3" stroke-linejoin="round"/><polygon points="150,50 232,92 150,134 68,92" fill="#F3EEE4" stroke="#2B1810" stroke-width="3" stroke-linejoin="round"/>${inner}</g></svg></div>`;

/* ---------- cálculos ---------- */
const nextT=(c,t)=>t==='r'?(c.ultimaRega||c.plantio)+c.regaDias*DAY:(c.ultimaCapina||c.plantio)+c.capinaDias*DAY;
const dias=(c,t)=>Math.round((d0(nextT(c,t))-d0(Date.now()))/DAY);
const diasV=i=>Math.round((d0(i.validade)-d0(Date.now()))/DAY);
const quando=d=>d<0?`atrasada ${-d} d`:d===0?'hoje':d===1?'amanhã':`em ${d} dias`;
const baixo=i=>(i.min||0)>0&&i.qtd<=i.min;
function avisos(){
  const a=[];
  cants.forEach(c=>[['r','Regar'],['c','Capinar']].forEach(([t,v])=>{const d=dias(c,t);if(d<=0)a.push({k:'t',o:d,c,t,v})}));
  itens.forEach(i=>{if(baixo(i))a.push({k:'e',o:-50,i});if(i.validade&&diasV(i)<=7)a.push({k:'v',o:diasV(i)-60,i})});
  fers.forEach(f=>{if(baixo(f))a.push({k:'f',o:-40,f})});
  return a.sort((x,y)=>x.o-y.o);
}

/* Oficina */
const filtraF=()=>fers.filter(f=>!q||(f.nome+' '+(f.local||'')).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.nome.localeCompare(b.nome));
const listaOf=()=>filtraF().map(f=>rowH(H(f.nome,'ferramenta'),esc(f.nome),`${esc(f.local||'sem local')} · qtd ${f.qtd}${f.emprestada?' · com '+esc(f.emprestada.com):''}`,f.emprestada?'Emprestada':EST[f.estado],f.emprestada?'w':EC[f.estado],`data-act="ofabrir" data-id="${f.id}"`)).join('')||'<div class="c"><div class="m">Nenhuma ferramenta encontrada.</div></div>';
function vOficina(){return `<h1>Ferramentaria e Oficina</h1>${island(big('martelo'),190)}<input class="in" id="busca" placeholder="Buscar ferramenta" value="${esc(q)}"><div id="lista" style="display:flex;flex-direction:column;gap:12px">${listaOf()}</div><button class="btn" data-act="ofnovo">+ Nova ferramenta</button>`}
function vOfNovo(){return `${back('oficina')}<h1>Nova ferramenta</h1>${field('nome','Nome',inp('nome','','placeholder="Ex.: Furadeira de impacto"'))}<div id="prev" class="r"></div><div class="g">${field('qtd','Quantidade',inp('qtd',1,'type="number" min="0"'))}${field('min','Avisar abaixo de',inp('min',0,'type="number" min="0"'))}</div>${field('local','Local',inp('local','','placeholder="Ex.: Prateleira B"'))}${field('estado','Estado',selH('estado',Object.entries(EST),'bom'))}<button class="btn" data-act="ofsalvar">Salvar ferramenta</button>`}
function vOfDet(){
  const f=fers.find(x=>x.id===selId);if(!f)return vOficina();
  return `${back('oficina')}<div class="r"><h1 class="f1">${esc(f.nome)}</h1><span class="t ${EC[f.estado]}">${EST[f.estado]}</span></div>${island(big(H(f.nome,'ferramenta')),190)}
<div class="c"><h2>Quantidade</h2><div class="r"><button class="btn sm" data-act="qmenos" data-id="${f.id}" aria-label="Diminuir">−</button><div class="f1" style="text-align:center;font-size:22px;font-weight:800">${f.qtd}</div><button class="btn sm" data-act="qmais" data-id="${f.id}" aria-label="Aumentar">+</button></div><div class="m">Local: ${esc(f.local||'não informado')}${f.min?' · avisar abaixo de '+f.min:''}</div></div>
${field('estado','Estado',selH('estado',Object.entries(EST),f.estado))}
<div class="c"><h2>Empréstimo</h2>${f.emprestada?`<div class="m">Com ${esc(f.emprestada.com)} desde ${fmt(f.emprestada.desde)}</div><button class="btn" data-act="devolveu" data-id="${f.id}">Foi devolvida</button>`:`<div class="m">Disponível na oficina</div><button class="btn" data-act="emprestar" data-id="${f.id}">Emprestar</button>`}</div>
<button class="btn w2" data-act="ofexcluir" data-id="${f.id}">Excluir ferramenta</button>`}

/* Paiol */
const filtraP=()=>itens.filter(i=>cat==='todos'||i.cat===cat).sort((a,b)=>a.nome.localeCompare(b.nome));
function vPaiol(){
  const h=d0(Date.now()),ent=movs.filter(m=>m.tipo==='entrada'&&d0(m.em)===h).length,sai=movs.filter(m=>m.tipo==='saida'&&d0(m.em)===h).length,venc=itens.filter(i=>i.validade&&diasV(i)<=30).length;
  const rows=filtraP().map(i=>{const dv=i.validade?diasV(i):null;
    return rowH(H(i.nome,'insumo'),esc(i.nome),i.validade?`Validade ${fmt(i.validade)}${dv<=30?' · '+(dv<0?'vencido':quando(dv)):''}`:'Sem validade',baixo(i)?'Baixo · '+i.qtd+' '+esc(i.unidade):i.qtd+' '+esc(i.unidade),baixo(i)||(dv!==null&&dv<0)?'p':'',`data-act="paabrir" data-id="${i.id}"`)}).join('');
  return `<h1>Paiol</h1>${island(big('saco'),170)}<div class="r">${box(ent,'Reposições hoje')}${box(sai,'Saídas hoje')}${box(venc,'Vencem em 30 d')}</div>
<div class="chips">${[['todos','Todos'],...Object.entries(CAT).map(([k,v])=>[k,v.n])].map(([k,l])=>`<button class="chip ${cat===k?'on':''}" data-act="cat" data-id="${k}">${l}</button>`).join('')}</div>${rows||'<div class="c"><div class="m">Nenhum item nesta categoria.</div></div>'}<button class="btn" data-act="panovo">+ Novo item</button>`}
function vPaNovo(){return `${back('paiol')}<h1>Novo item do paiol</h1>${field('nome','Nome',inp('nome','','placeholder="Ex.: Ração tilápia"'))}<div id="prev" class="r"></div>${field('cat','Categoria',selH('cat',Object.entries(CAT).map(([k,v])=>[k,v.n]),'grao'))}<div class="g">${field('unidade','Unidade',inp('unidade','kg'))}${field('qtd','Quantidade inicial',inp('qtd',0,'type="number" min="0" step="any"'))}</div><div class="g">${field('min','Avisar abaixo de',inp('min',0,'type="number" min="0" step="any"'))}${field('validade','Validade (opcional)',inp('validade','','type="date"'))}</div><button class="btn" data-act="pasalvar">Salvar item</button>`}
function vPaDet(){
  const i=itens.find(x=>x.id===selId);if(!i)return vPaiol();
  const hist=movs.filter(m=>m.itemId===i.id).slice(0,6).map(m=>`<div class="m">${fmt(m.em)} · ${m.tipo==='entrada'?'reposição':'saída'} ${m.qtd} ${esc(m.unidade)}${m.destino?' · '+esc(m.destino):''}</div>`).join('')||'<div class="m">Sem movimentos ainda.</div>';
  return `${back('paiol')}<div class="r"><h1 class="f1">${esc(i.nome)}</h1><span class="t ${baixo(i)?'p':''}">${i.qtd} ${esc(i.unidade)}</span></div>${island(big(H(i.nome,'insumo')),170)}
<div class="c"><div class="m">${CAT[i.cat]?.n||'Outros'}${i.min?' · avisar abaixo de '+i.min+' '+esc(i.unidade):''}${i.validade?' · validade '+fmt(i.validade):''}</div></div>
<div class="c"><h2>Repor estoque</h2><div class="m">A reposição entra direto neste item.</div><div class="r">${inp('rq','','type="number" min="0" step="any" placeholder="Quantidade"')}<button class="btn" data-act="entrada" data-id="${i.id}">+ Repor</button></div></div>
<div class="c"><h2>Dar saída</h2><div class="g">${inp('sq','','type="number" min="0" step="any" placeholder="Quantidade"')}${selH('sd',DEST.map(d=>[d,d]),'Tanque 1')}</div><button class="btn w2" data-act="saida" data-id="${i.id}">− Registrar saída</button></div>
<div class="c"><h2>Histórico</h2>${hist}</div><button class="btn w2" data-act="paexcluir" data-id="${i.id}">Excluir item</button>`}

/* Perfil e propriedades */
const avatar=s=>user.photoURL?`<img src="${esc(user.photoURL)}" alt="" referrerpolicy="no-referrer" style="width:${s}px;height:${s}px;border-radius:50%;border:1px solid #B8893B;object-fit:cover;flex:none">`:`<div class="b" style="width:${s}px;height:${s}px;border-radius:50%;background:#2B1810;color:#E3C98F;font:700 ${Math.round(s/2.4)}px Inter,sans-serif">${esc((user.displayName||'?')[0])}</div>`;
function vPerfil(){
  const dono=sitio?.donoUid===user.uid;
  return `${back('home')}<h1>Meu perfil</h1>
<div class="c" style="align-items:center;text-align:center">${avatar(84)}<h2>${esc(user.displayName||'Sem nome')}</h2><div class="m">${esc(user.email||'')}</div></div>
<div class="c"><h2>Propriedade ativa</h2><div class="m">${esc(sitio?.nome||'—')} · você é ${dono?'dono':'membro'}</div><button class="btn w2" data-go="props">Minhas propriedades (${props.length})</button></div>
<div class="c"><h2>Dados</h2><div class="m">Baixe uma cópia de tudo da propriedade ativa.</div><button class="btn w2" data-act="exportar">Exportar dados (backup)</button></div>
<div class="c"><h2>Conta</h2><div class="m">Login feito com a sua conta Google. Sair desconecta só este aparelho.</div><button class="btn w2" data-act="logout">Sair da conta</button></div>
<div class="m" style="text-align:center">App Sítio · versão 3</div>`}
function vProps(){
  return `${back('home')}<h1>Minhas propriedades</h1><div class="m">Cada propriedade tem seus próprios canteiros, ferramentas, paiol e tanques.</div>`+
  props.map(p=>`<div class="c"><div class="r"><div class="f1"><h2>${esc(p.nome)}</h2><div class="m">${esc(p.tipo||'Sítio')}${p.cidade?' · '+esc(p.cidade):''} · ${p.donoUid===user.uid?'dono':'membro'}</div></div>${p.id===sid?'<span class="t">Ativa</span>':''}</div>${p.id===sid?`<button class="btn w2 sm" data-act="renomear">Renomear</button>`:`<button class="btn sm" data-act="trocar" data-id="${p.id}">Abrir esta propriedade</button>`}</div>`).join('')+
  `<button class="btn" data-act="propnovo">+ Nova propriedade</button><div class="m">Convidar outras pessoas para a mesma propriedade chega em uma próxima etapa.</div>`}
function vPropNovo(){return `${back('props')}<h1>Nova propriedade</h1>${field('nome','Nome',inp('nome','','placeholder="Ex.: Fazenda Santa Luzia"'))}${field('tipo','Tipo',selH('tipo',['Sítio','Fazenda','Chácara','Outro'].map(x=>[x,x]),'Sítio'))}${field('cidade','Cidade (opcional)',inp('cidade','','placeholder="Ex.: Marechal Floriano"'))}<button class="btn" data-act="propsalvar">Criar propriedade</button>`}

/* ---------- render ---------- */
const VIEWS={perfil:vPerfil,props:vProps,propnovo:vPropNovo,home:vHome,hortas:vHortas,novo:vNovo,detalhe:vDetalhe,oficina:vOficina,ofnovo:vOfNovo,ofdet:vOfDet,paiol:vPaiol,panovo:vPaNovo,padet:vPaDet};
const AREA={perfil:'home',props:'home',propnovo:'home',home:'home',hortas:'hortas',novo:'hortas',detalhe:'hortas',oficina:'oficina',ofnovo:'oficina',ofdet:'oficina',paiol:'paiol',panovo:'paiol',padet:'paiol'};
function render(){
  const app=$('#app'),nav=$('#nav');
  if(erroDb&&(!sid||!user)){nav.hidden=true;app.innerHTML=splash(erroDb);return}
  if(!authReady||!splashOk||(user&&!sid)){nav.hidden=true;app.innerHTML=splash(authReady&&user?'Carregando seu sítio…':'Abrindo…');return}
  if(!user){nav.hidden=true;app.innerHTML=vLogin();return}
  app.innerHTML=VIEWS[view]();
  nav.hidden=false;const on=AREA[view];
  nav.innerHTML=[['home','Início'],['hortas','Hortas'],['oficina','Oficina'],['paiol','Paiol']].map(([k,l])=>`<button class="${on===k?'on':''}" data-go="${k}">${l}</button>`).join('')+`<button class="off" data-act="soon">Peixes</button>`;
}
const typing=()=>/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'');
const refresh=()=>{if(!typing())render()};

/* ---------- ações ---------- */
const ganhar=n=>XP_ATIVO?updateDoc(doc(db,'sitios',sid),{xp:increment(n)}):null;
const num=id=>parseFloat(String(val(id)).replace(',','.'));
document.addEventListener('click',async e=>{
  const g=e.target.closest('[data-go]');if(g){view=g.dataset.go;render();scrollTo(0,0);return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  try{
    if(a==='login')await signInWithPopup(auth,new GoogleAuthProvider());
    else if(a==='logout')await signOut(auth);
    else if(a==='soon')toast('Essa área chega nas próximas etapas');
    else if(a==='exportar')exportar();
    else if(a==='cat'){cat=id;render()}
    else if(a==='novo'){view='novo';render()}
    else if(a==='abrir'){selId=id;view='detalhe';render();scrollTo(0,0)}
    else if(a==='salvar'){
      const pn=val('planta').trim(),rd=num('rd'),cd=num('cd'),pl=val('plantio');
      if(!pn||!pl||!(rd>=1)||!(cd>=1)){toast('Informe a planta, a data e os intervalos');return}
      el.disabled=true;
      await addDoc(col('canteiros'),{nome:val('nome').trim()||'Canteiro',planta:pn,plantio:new Date(pl+'T00:00:00').getTime(),regaDias:rd,capinaDias:cd,criadoEm:Date.now()});
      ensureHolo(pn,'planta').catch(()=>{});view='hortas';render();toast('Canteiro salvo')}
    else if(a==='reguei'){await updateDoc(dref('canteiros',id),{ultimaRega:Date.now()});await ganhar(20);toast('Rega registrada')}
    else if(a==='capinei'){await updateDoc(dref('canteiros',id),{ultimaCapina:Date.now()});await ganhar(30);toast('Capina registrada')}
    else if(a==='feito'){const t=el.dataset.t;await updateDoc(dref('canteiros',id),t==='r'?{ultimaRega:Date.now()}:{ultimaCapina:Date.now()});await ganhar(t==='r'?20:30);toast('Feito!')}
    else if(a==='excluir'){if(confirm('Excluir este canteiro?')){await deleteDoc(dref('canteiros',id));view='hortas';render()}}
    else if(a==='propnovo'){view='propnovo';render()}
    else if(a==='propsalvar'){
      const nome=val('nome').trim();if(!nome){toast('Informe o nome da propriedade');return}
      el.disabled=true;
      const r=await addDoc(collection(db,'sitios'),{nome,tipo:val('tipo'),cidade:val('cidade').trim(),donoUid:user.uid,memberUids:[user.uid],xp:0,criadoEm:Date.now()});
      await setDoc(doc(db,'users',user.uid),{sitioId:r.id},{merge:true});abrirSitio(r.id);view='home';render();toast('Propriedade criada')}
    else if(a==='trocar'){await setDoc(doc(db,'users',user.uid),{sitioId:id},{merge:true});abrirSitio(id);view='home';render();scrollTo(0,0)}
    else if(a==='renomear'){const n=(prompt('Novo nome da propriedade:',sitio?.nome||'')||'').trim();if(n)await updateDoc(doc(db,'sitios',sid),{nome:n})}
    /* oficina */
    else if(a==='ofnovo'){view='ofnovo';render()}
    else if(a==='ofabrir'){selId=id;view='ofdet';render();scrollTo(0,0)}
    else if(a==='ofsalvar'){
      const nome=val('nome').trim(),qtd=num('qtd'),min=num('min')||0;
      if(!nome||!(qtd>=0)){toast('Informe o nome e a quantidade');return}
      el.disabled=true;
      await addDoc(col('ferramentas'),{nome,qtd,min,local:val('local').trim(),estado:val('estado'),emprestada:null,criadoEm:Date.now()});
      ensureHolo(nome,'ferramenta').catch(()=>{});view='oficina';render();toast('Ferramenta salva')}
    else if(a==='qmais'||a==='qmenos'){await updateDoc(dref('ferramentas',id),{qtd:increment(a==='qmais'?1:-1)})}
    else if(a==='emprestar'){const com=(prompt('Quem pegou a ferramenta?')||'').trim();if(com)await updateDoc(dref('ferramentas',id),{emprestada:{com,desde:Date.now()}})}
    else if(a==='devolveu'){await updateDoc(dref('ferramentas',id),{emprestada:null});toast('Devolvida')}
    else if(a==='ofexcluir'){if(confirm('Excluir esta ferramenta?')){await deleteDoc(dref('ferramentas',id));view='oficina';render()}}
    /* paiol */
    else if(a==='panovo'){view='panovo';render()}
    else if(a==='paabrir'){selId=id;view='padet';render();scrollTo(0,0)}
    else if(a==='pasalvar'){
      const nome=val('nome').trim(),qtd=num('qtd'),min=num('min')||0,v=val('validade');
      if(!nome||!(qtd>=0)){toast('Informe o nome e a quantidade');return}
      el.disabled=true;
      await addDoc(col('itens'),{nome,cat:val('cat'),unidade:val('unidade').trim()||'un',qtd,min,validade:v?new Date(v+'T00:00:00').getTime():null,criadoEm:Date.now()});
      ensureHolo(nome,'insumo').catch(()=>{});view='paiol';render();toast('Item salvo')}
    else if(a==='entrada'||a==='saida'){
      const i=itens.find(x=>x.id===id),n=num(a==='entrada'?'rq':'sq');
      if(!(n>0)){toast('Informe a quantidade');return}
      if(a==='saida'&&n>i.qtd){toast('Estoque insuficiente');return}
      const b=writeBatch(db);
      b.update(dref('itens',id),{qtd:increment(a==='entrada'?n:-n)});
      b.set(doc(col('movimentos')),{itemId:id,nome:i.nome,tipo:a,qtd:n,unidade:i.unidade,destino:a==='saida'?val('sd'):'',em:Date.now()});
      await b.commit();toast(a==='entrada'?'Reposição registrada':'Saída registrada')}
    else if(a==='paexcluir'){if(confirm('Excluir este item? O histórico dele continua nos backups.')){await deleteDoc(dref('itens',id));view='paiol';render()}}
  }catch(err){console.error(err);toast('Algo deu errado: '+(err.code||err.message))}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='cat'&&view==='panovo'){$('#unidade').value=CAT[t.value].u}
  else if(t.id==='estado'&&view==='ofdet'){try{await updateDoc(dref('ferramentas',selId),{estado:t.value})}catch(err){toast('Erro: '+(err.code||err.message))}}
});
const presetFor=n=>Object.values(PRE).find(p=>p.n!=='Outra planta'&&norm(n).includes(norm(p.n)));
function prev(){const p=$('#prev');if(!p)return;const kind=view==='novo'?'planta':view==='ofnovo'?'ferramenta':'insumo',n=val(view==='novo'?'planta':'nome').trim();p.innerHTML=n?`${mini(H(n,kind),44)}<span class="m">Holograma gerado automaticamente${holos[slug(n)]?' (já existia)':''}</span>`:''}
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='busca'){q=e.target.value;$('#lista').innerHTML=listaOf()}
  else if(id==='planta'||id==='nome'){prev();if(id==='planta'){const p=presetFor(e.target.value);if(p){$('#rd').value=p.r;$('#cd').value=p.c}}}
});

/* ---------- backup ---------- */
function exportar(){
  const dados={exportadoEm:new Date().toISOString(),sitio,canteiros:cants,ferramentas:fers,itens,movimentos:movs};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(dados,null,1)],{type:'application/json'}));
  a.download='sitio-backup-'+hojeISO()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup baixado');
}

/* ---------- login e dados ---------- */
function falha(err){erroDb='Não consegui acessar o banco. Verifique se o Firestore foi criado e as regras publicadas.';console.error(err);toast('Erro no banco de dados');render()}
let dataUnsubs=[];
const sub=(n,set,ref)=>onSnapshot(ref||col(n),s=>{set(s.docs.map(d=>({id:d.id,...d.data()})));refresh()},falha);
function abrirSitio(id){
  dataUnsubs.forEach(f=>f());dataUnsubs=[];sid=id;sitio=null;cants=[];fers=[];itens=[];movs=[];holos={};
  dataUnsubs.push(onSnapshot(doc(db,'sitios',sid),s=>{sitio=s.data();refresh()},falha),
    sub('canteiros',a=>cants=a.sort((x,y)=>x.criadoEm-y.criadoEm)),
    sub('ferramentas',a=>fers=a),
    sub('hologramas',a=>{holos=Object.fromEntries(a.map(x=>[x.id,x]))}),
    sub('itens',a=>itens=a),
    sub('movimentos',a=>movs=a,query(col('movimentos'),orderBy('em','desc'),limit(200))));
  render();
}
onAuthStateChanged(auth,async u=>{
  unsubs.forEach(f=>f());unsubs=[];dataUnsubs.forEach(f=>f());dataUnsubs=[];
  user=u;authReady=true;holos={};sid=null;sitio=null;props=[];cants=[];fers=[];itens=[];movs=[];erroDb='';view='home';render();
  if(!u)return;
  try{
    const uref=doc(db,'users',u.uid);let id=(await getDoc(uref)).data()?.sitioId;
    if(!id){
      /* primeira vez: limpa dados de teste antigos e cria o sítio */
      const velhos=await getDocs(collection(db,'users',u.uid,'canteiros'));await Promise.all(velhos.docs.map(d=>deleteDoc(d.ref)));
      const r=await addDoc(collection(db,'sitios'),{nome:'Sítio Bom Jesus',donoUid:u.uid,memberUids:[u.uid],xp:0,criadoEm:Date.now()});
      await setDoc(uref,{sitioId:r.id},{merge:true});id=r.id;
    }
    unsubs.push(onSnapshot(query(collection(db,'sitios'),where('memberUids','array-contains',u.uid)),s=>{props=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.criadoEm-b.criadoEm);refresh()},falha));
    abrirSitio(id);
  }catch(err){falha(err)}
});
render();
</script>
</body>
</html>
